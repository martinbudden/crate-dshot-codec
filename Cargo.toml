[package]
name = "dshot-codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-dshot-codec"
description = "Encodes Dshot commands and decodes Dshot telemetry"
keywords = ["dshot", "no-std", "esc"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::protocols",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
# default = ["defmt"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
defmt = { version = "1.0.1", optional = true }


[workspace]
members = [
    ".",
    "xtask",
]
